<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PRIME v7</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: Arial;
  color: white;
}

/* TOP BAR */
header {
  position: fixed;
  top: 0;
  width: 100%;
  height: 55px;
  background: #0a0a0a;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 15px;
  border-bottom: 1px solid #222;
  z-index: 10;
}

.logo {
  color: #00ffe5;
  font-weight: bold;
}

/* TOOLBOX */
#tools {
  position: fixed;
  left: 10px;
  top: 70px;
  width: 150px;
  background: #111;
  border: 1px solid #333;
  z-index: 20;
}

.tool {
  padding: 10px;
  border-bottom: 1px solid #222;
  cursor: pointer;
  text-align: center;
}

/* 3D VIEW */
#scene3d {
  position: absolute;
  top: 55px;
  width: 100%;
  height: calc(100% - 55px);
}

/* BOTTOM */
#bottom {
  position: fixed;
  bottom: 10px;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 10px;
}

.btn {
  background: #00ffe5;
  border: none;
  padding: 10px;
  border-radius: 10px;
}
</style>
</head>

<body>

<header>
  <div class="logo">PRIME v7 UNIVERSAL BUILDER</div>
</header>

<!-- TOOLBOX -->
<div id="tools">
  <div class="tool" onclick="setType('box')">Box</div>
  <div class="tool" onclick="setType('sphere')">Sphere</div>
  <div class="tool" onclick="setType('cylinder')">Cylinder</div>
  <div class="tool" onclick="setType('cone')">Cone</div>
  <div class="tool" onclick="setType('pyramid')">Pyramid</div>
</div>

<div id="scene3d"></div>

<div id="bottom">
  <button class="btn" onclick="saveWorld()">Save World</button>
  <button class="btn" onclick="loadWorld()">Load World</button>
  <button class="btn" onclick="clearWorld()">Clear</button>
</div>

<script>

/* ===== CORE ===== */
let scene, camera, renderer;
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();

let objects = [];
let selected = null;
let dragging = false;

let currentType = "box";

/* SET TYPE */
function setType(t){
  currentType = t;
}

/* INIT */
function init(){
  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
  camera.position.set(0,2,6);

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(window.innerWidth, window.innerHeight - 55);
  document.getElementById("scene3d").appendChild(renderer.domElement);

  animate();
}

/* CREATE ANY OBJECT */
function createObject(type){

  let geo;

  switch(type){
    case "sphere":
      geo = new THREE.SphereGeometry(0.5);
      break;
    case "cylinder":
      geo = new THREE.CylinderGeometry(0.5,0.5,1);
      break;
    case "cone":
      geo = new THREE.ConeGeometry(0.5,1);
      break;
    case "pyramid":
      geo = new THREE.ConeGeometry(0.7,1,4);
      break;
    default:
      geo = new THREE.BoxGeometry(1,1,1);
  }

  let mat = new THREE.MeshBasicMaterial({
    color: 0x00ffe5,
    wireframe: true
  });

  let mesh = new THREE.Mesh(geo, mat);

  mesh.userData.type = type;
  mesh.position.set(
    (Math.random()-0.5)*3,
    (Math.random()-0.5)*2,
    0
  );

  scene.add(mesh);
  objects.push(mesh);
}

/* INPUT */
window.addEventListener("pointerdown",(e)=>{

  mouse.x = (e.clientX/window.innerWidth)*2-1;
  mouse.y = -(e.clientY/(window.innerHeight-55))*2+1;

  raycaster.setFromCamera(mouse,camera);

  let hits = raycaster.intersectObjects(objects);

  if(hits.length > 0){
    selected = hits[0].object;
    dragging = true;
  } else {
    createObject(currentType);
  }
});

window.addEventListener("pointermove",(e)=>{
  if(!dragging || !selected) return;

  selected.position.x += e.movementX * 0.01;
  selected.position.y -= e.movementY * 0.01;
});

window.addEventListener("pointerup",()=>{
  dragging = false;
  selected = null;
});

/* CAMERA ZOOM */
window.addEventListener("wheel",(e)=>{
  camera.position.z += e.deltaY * 0.01;
});

/* SAVE */
function saveWorld(){
  let data = objects.map(o => ({
    t: o.userData.type,
    x: o.position.x,
    y: o.position.y,
    z: o.position.z
  }));

  localStorage.setItem("prime_world", JSON.stringify(data));
  alert("World Saved");
}

/* LOAD */
function loadWorld(){
  clearWorld();

  let data = JSON.parse(localStorage.getItem("prime_world") || "[]");

  data.forEach(d=>{
    currentType = d.t;
    createObject(d.t);
    let obj = objects[objects.length-1];
    obj.position.set(d.x,d.y,d.z);
  });

  alert("World Loaded");
}

/* CLEAR */
function clearWorld(){
  objects.forEach(o=>scene.remove(o));
  objects=[];
}

/* LOOP */
function animate(){
  requestAnimationFrame(animate);
  renderer.render(scene,camera);
}

init();

</script>

</body>
</html>
